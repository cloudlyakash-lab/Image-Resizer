name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev clang lld ccache curl wget

      - name: Install Buildozer and Tooling
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.36
          pip install --upgrade virtualenv
          pip install --upgrade buildozer

            - name: Pre-cache freetype package (Bypass 502 Bad Gateway)
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/
          wget https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download -O .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz || \
          wget https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz -O .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz || \
          wget https://mirror.download.it/gnu/freetype/freetype-2.14.1.tar.gz -O .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz || true

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ImageResizer-APK
          path: bin/*.apk
